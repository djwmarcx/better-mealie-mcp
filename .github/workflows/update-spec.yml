name: Update Mealie OpenAPI spec

on:
  schedule:
    - cron: "17 4 * * *"   # daily drift check against the pinned tag
  workflow_dispatch:
    inputs:
      mealie_tag:
        description: "Mealie Docker tag to pull the spec from (e.g. v3.21.0, latest, nightly). Blank = the pinned default."
        required: false
        default: ""

# Auto-track the latest stable Mealie release. Each run pulls that image's real
# version; when the spec changes, the run bumps the version and cuts a release.
# Pin a specific version here (e.g. "v3.20.1") or via the dispatch input to
# freeze on one release instead.
env:
  MEALIE_TAG_DEFAULT: "latest"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-spec
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install project (gen_tools needs fastmcp + httpx to measure costs)
        # Install from uv.lock, not `pip install .`: the wizard's COSTS are
        # measured through fastmcp, so unpinned deps made them drift with every
        # fastmcp release and opened spurious "spec sync" PRs. The locked set
        # is also what the Docker image ships, so the numbers match reality.
        run: |
          pip install uv
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve + validate the Mealie tag
        env:
          INPUT_TAG: ${{ github.event.inputs.mealie_tag }}
        run: |
          TAG="${INPUT_TAG:-$MEALIE_TAG_DEFAULT}"
          # [[ =~ ]] matches the whole string; grep would pass a value whose
          # first line looks valid, and $GITHUB_ENV is line-based.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid Mealie tag: $TAG"; exit 1
          fi
          echo "MEALIE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using Mealie tag: $TAG"

      - name: Boot Mealie ${{ env.MEALIE_TAG }} and capture its version
        run: |
          docker run -d --name mealie -p 9925:9000 \
            -e ALLOW_SIGNUP=true -e BASE_URL=http://localhost:9925 -e TZ=UTC \
            "ghcr.io/mealie-recipes/mealie:${MEALIE_TAG}"
          for i in $(seq 1 80); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9925/api/app/about || true)"
            [ "$code" = "200" ] && break
            sleep 3
          done
          VER="$(curl -fsS http://localhost:9925/api/app/about | python -c 'import sys,json;print(json.load(sys.stdin)["version"])')"
          # Untrusted container output: it becomes an env var (a newline here
          # would define arbitrary variables for later steps), a branch name
          # and a dispatch ref, so accept only a plain version string.
          if ! [[ "$VER" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Unexpected Mealie version: $VER"; exit 1
          fi
          echo "MEALIE_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Mealie reports version: $VER"

      - name: Pull spec, canonicalize, regenerate tool reference
        run: |
          cp openapi.json /tmp/old-spec.json
          curl -fsSL http://localhost:9925/openapi.json -o openapi.json
          python scripts/gen_tools.py   # normalizes + pretty-writes openapi.json

      - name: Open a PR if the spec changed
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gate on the spec itself. Derived files (TOOLS.md, wizard COSTS) can
          # drift on their own after a dependency bump; that is not a new spec
          # and must not bump the version or log a VERSIONS.md row. They catch
          # up with the next real spec sync.
          if git diff --quiet -- openapi.json; then
            echo "Spec unchanged for ${MEALIE_VERSION} - nothing to do."
            exit 0
          fi

          DATE="$(date -u +%Y-%m-%d)"
          TOOLS="$(python -c "import json;from better_mealie_mcp.naming import build_names;print(len(build_names(json.load(open('openapi.json')))))")"
          python scripts/set_version.py "$MEALIE_VERSION" "$DATE" "$TOOLS"
          # set_version bumps pyproject's version; re-lock so `uv sync --locked`
          # (Docker build) keeps working.
          uv lock
          python scripts/spec_diff.py /tmp/old-spec.json openapi.json > /tmp/notes.md
          echo "----- proposed change -----"; cat /tmp/notes.md

          # One branch per Mealie version, no date: a stale PR gets force-pushed
          # and refreshed instead of piling up a new PR every night.
          BRANCH="bot/spec-${MEALIE_VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore: sync Mealie OpenAPI spec (${MEALIE_VERSION})"
          git push -f origin "$BRANCH"

          # Open the PR, or refresh its body if one is already open for this branch.
          # main is protected — the release is cut on merge by release-on-spec.yml.
          gh pr create --base main --head "$BRANCH" \
            --title "chore: sync Mealie OpenAPI spec (${MEALIE_VERSION})" \
            --body-file /tmp/notes.md \
          || gh pr edit "$BRANCH" --body-file /tmp/notes.md

          # This branch is rebuilt from current main, so it already contains
          # everything an older bot/spec-* PR would bring. Close those: two
          # open spec PRs edit the same VERSIONS.md / wizard lines and the
          # second one to merge always conflicts.
          # Same-repo PRs only: a fork can name its branch bot/spec-* too.
          BRANCH="$BRANCH" gh pr list --state open --base main \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not)
                      | select(.headRefName | startswith("bot/spec-"))
                      | select(.headRefName != env.BRANCH) | .number' \
          | while read -r n; do
              gh pr close "$n" --delete-branch \
                --comment "Superseded by the ${MEALIE_VERSION} spec sync on \`$BRANCH\`."
            done
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stop Mealie
        if: always()
        run: docker rm -f mealie || true

    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}

  # GitHub creates the pull_request run of docker-test for the bot's PR but
  # holds it for manual approval (github-actions[bot] counts as a first-time
  # contributor), and the required checks wait on exactly that run. Approve
  # it so the PR can merge. A separate job so actions: write is held only
  # here, with no checkout and no third-party code.
  approve-checks:
    needs: update
    if: needs.update.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write   # approve the held run
      contents: read
    steps:
      - name: Approve the held docker-test run on the spec branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.update.outputs.branch }}
          SHA: ${{ needs.update.outputs.sha }}
        run: |
          # Re-check here: this job holds actions: write, so it trusts nothing
          # it did not validate itself.
          if ! [[ "$BRANCH" =~ ^bot/spec-v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Unexpected spec branch: $BRANCH"; exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit: $SHA"; exit 1
          fi
          # The run appears asynchronously after the PR is opened or refreshed.
          # Match on head repository, branch, workflow file and exact commit, so
          # a fork PR carrying the same commit under the same branch name can
          # never be the run that gets approved.
          runs=""
          for _ in $(seq 1 18); do
            runs="$(gh api "repos/$GH_REPO/actions/runs?event=pull_request&head_sha=$SHA&per_page=50" \
              --jq '.workflow_runs[]
                    | select(.head_repository.full_name == env.GH_REPO
                             and .head_branch == env.BRANCH
                             and .path == ".github/workflows/docker-test.yml")
                    | "\(.id) \(.status) \(.conclusion)"')"
            [ -n "$runs" ] && break
            sleep 10
          done
          if [ -z "$runs" ]; then
            echo "::error::No docker-test run for $BRANCH@${SHA:0:7}; check the PR by hand."
            exit 1
          fi
          while read -r run_id status conclusion; do
            if [ "$conclusion" = "action_required" ]; then
              gh api -X POST "repos/$GH_REPO/actions/runs/$run_id/approve"
              echo "approved held run $run_id"
            else
              echo "run $run_id is $status/$conclusion; nothing to approve"
            fi
          done <<<"$runs"
