name: Test Docker image

# Builds the image and smoke-tests it (scripts/smoke_image.sh) on every PR and
# every push to main, natively on both shipped architectures. Catches images
# that build fine but can't start, e.g. a builder/runtime Python mismatch (#61).
#
# Spec-update PRs are opened with GITHUB_TOKEN, which doesn't trigger
# pull_request runs; they're still covered by the push run after merge and by
# the same smoke test gating publish.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t better-mealie-mcp:smoke .

      - name: Smoke-test image
        run: scripts/smoke_image.sh better-mealie-mcp:smoke
